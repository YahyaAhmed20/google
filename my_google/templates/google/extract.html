<!DOCTYPE html>
{% load static %}
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النص المستخرج</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <header class="p-3">
        <div class="d-flex justify-content-between align-items-center">
          <!-- Google Logo (في الهيدر) -->
          <a href="/" class="d-none d-md-block">
              <img src="{% static 'img/logo.jpg' %}" alt="Google Logo" class="logo-img" style="max-width: 150px;">
          </a>
          <div class="flex-grow-1"></div>
          <!-- Login/Profile Dropdown -->
          <div class="d-flex justify-content-end me-3">
            {% if user.is_authenticated %}
              <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle shadow-sm" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="fas fa-user-circle me-1"></i> Profile
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="profileDropdown">
                  <li>
                    <a class="dropdown-item" href="{% url 'accounts:profile' %}">
                      <i class="fas fa-user me-2"></i> View Profile
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="{% url 'accounts:profile_edit' %}">
                      <i class="fas fa-edit me-2"></i> Edit Profile
                    </a>
                  </li>
                  <li><hr class="dropdown-divider"></li>
                  <li>
                    <form method="post" action="{% url 'account_logout' %}" class="d-inline">
                      {% csrf_token %}
                      <button type="submit" class="dropdown-item text-danger">
                        <i class="fas fa-sign-out-alt me-2"></i> Logout
                      </button>
                    </form>
                  </li>
                </ul>
              </div>
            {% else %}
              <a href="{% url 'account_login' %}" class="btn btn-success shadow-sm">
                <i class="fas fa-sign-in-alt me-1"></i> Log in
              </a>
            {% endif %}
          </div>
        </div>
      </header>
    <style>
        .extracted-text {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            direction: ltr; /* دعم النصوص الإنجليزية */
        }
        .extracted-text:dir(rtl) {
            direction: rtl; /* دعم النصوص العربية */
        }
        .highlight {
            background-color: #e0f7fa;
            transition: background-color 0.3s;
        }
        .card-header {
            background-color: #007bff;
            color: white;
            border-radius: 8px 8px 0 0;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">النص المستخرج</h5>
                        <button id="copy-btn" class="btn btn-sm btn-light" title="نسخ النص">
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="extracted-text" class="extracted-text">{{ extracted_text }}</div>
                    </div>
                </div>
                <a href="/" class="btn btn-secondary mt-3">العودة للصفحة الرئيسية</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('copy-btn').addEventListener('click', function () {
            const textDiv = document.getElementById('extracted-text');
            const range = document.createRange();
            range.selectNodeContents(textDiv);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            document.execCommand('copy');
            selection.removeAllRanges();

            textDiv.classList.add('highlight');
            this.innerHTML = '<i class="bi bi-check-circle"></i> تم النسخ!';
            setTimeout(() => {
                textDiv.classList.remove('highlight');
                this.innerHTML = '<i class="bi bi-clipboard"></i>';
            }, 2000);
        });
    </script>
</body>
</html>
